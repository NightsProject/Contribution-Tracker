[project]
name = "contribution-tracker"
version = "0.1.0"
description = "Role-based shared-pool contribution and expense tracker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "pillow>=10,<13",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.uv]
package = false
