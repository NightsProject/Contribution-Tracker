services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contribution_tracker
      POSTGRES_USER: contribution
      POSTGRES_PASSWORD: change-me-for-local-development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contribution -d contribution_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: contribution_tracker
      POSTGRES_USER: contribution
      POSTGRES_PASSWORD: change-me-for-local-development
      POSTGRES_PORT: 5432
      SESSION_COOKIE_SECURE: "false"
      WEB_PORT: 8000
      APP_DOMAIN: localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data: