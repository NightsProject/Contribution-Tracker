{% extends "base.html" %}
{% block title %}Sign up · {{ app_name }}{% endblock %}
{% block content %}
<section>
  <h1>Create an account</h1>
  <p class="muted">New accounts are contributors with standard user access.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/signup">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="full_name">Name</label>
    <input id="full_name" name="full_name" type="text" maxlength="200" value="{{ full_name }}" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="320" value="{{ email }}" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
    <label for="password_confirmation">Confirm password</label>
    <input id="password_confirmation" name="password_confirmation" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
    <button type="submit">Create account</button>
  </form>
  <p>Already have an account? <a href="/login">Sign in</a></p>
</section>
{% endblock %}
